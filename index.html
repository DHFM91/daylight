<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dave's Daily Dashboard</title>
<meta name="description" content="A calm start page: clock, weather, air quality, sun and moon for any city.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='14' fill='%23fbbf24'/%3E%3Cg stroke='%23fbbf24' stroke-width='5' stroke-linecap='round'%3E%3Cpath d='M32 4v8M32 52v8M4 32h8M52 32h8M12 12l6 6M46 46l6 6M12 52l6-6M46 18l6-6'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sky1: #8ec5fc; --sky2: #e0c3fc;
    --ink: #1f2937; --ink-soft: #4b5563; --ink-faint: #6b7280;
    --card: rgba(255,255,255,0.80); --card-border: rgba(255,255,255,0.75);
    --line: rgba(31,41,55,0.10);
    --accent: #f59e0b;
    --shadow: 0 10px 30px rgba(30,41,59,0.10), 0 2px 6px rgba(30,41,59,0.06);
    --radius: 22px;
  }
  body.dark {
    --ink: #f1f5f9; --ink-soft: #cbd5e1; --ink-faint: #94a3b8;
    --card: rgba(15,23,42,0.68); --card-border: rgba(255,255,255,0.10);
    --line: rgba(255,255,255,0.10);
    --shadow: 0 10px 30px rgba(0,0,0,0.30), 0 2px 6px rgba(0,0,0,0.20);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--sky2);
    transition: color .6s ease;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; background: linear-gradient(160deg, var(--sky1), var(--sky2)); }
  button, input, select { font: inherit; color: inherit; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 22px 40px; }

  /* ---------- header ---------- */
  header.top {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; flex-wrap: wrap;
    margin-bottom: 22px;
  }
  .clock-block .greeting { font-size: 1.05rem; font-weight: 500; color: var(--ink-soft); letter-spacing: .01em; }
  .clock-block .clock { font-size: clamp(3.6rem, 9vw, 6.2rem); font-weight: 300; line-height: 1; letter-spacing: -0.03em; margin: 4px 0 6px; font-variant-numeric: tabular-nums; }
  .clock-block .clock .ampm { font-size: .32em; font-weight: 500; margin-left: .25em; letter-spacing: 0; color: var(--ink-soft); }
  .clock-block .date { font-size: 1.05rem; font-weight: 500; color: var(--ink-soft); }
  .top-right { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  .place-btn {
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
    background: var(--card); border: 1px solid var(--card-border); border-radius: 999px;
    padding: 9px 16px; font-weight: 600; box-shadow: var(--shadow);
  }
  .place-btn:hover { filter: brightness(1.04); }
  .place-btn svg { width: 16px; height: 16px; }
  .tool-row { display: flex; gap: 8px; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; cursor: pointer;
    background: var(--card); border: 1px solid var(--card-border); box-shadow: var(--shadow);
  }
  .icon-btn svg { width: 19px; height: 19px; }
  .icon-btn.on { background: var(--ink); color: #fff; }
  body.dark .icon-btn.on { background: #f1f5f9; color: #0f172a; }
  .updated { font-size: .78rem; color: var(--ink-faint); }

  /* ---------- search ---------- */
  form.search { margin: 0 0 22px; position: relative; }
  form.search input {
    width: 100%; padding: 15px 20px 15px 50px; border-radius: 999px; font-size: 1.02rem;
    background: var(--card); border: 1px solid var(--card-border); box-shadow: var(--shadow); outline: none;
  }
  form.search input::placeholder { color: var(--ink-faint); }
  form.search input:focus { border-color: var(--accent); }
  form.search svg { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); width: 19px; height: 19px; color: var(--ink-faint); z-index: 1; pointer-events: none; }

  /* ---------- grid + cards ---------- */
  .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 18px; }
  .card {
    background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 20px 22px; position: relative; min-width: 0;
    transition: transform .25s ease, box-shadow .25s ease;
    
  }
  .grid.first .card { animation: rise .5s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .span-4 { grid-column: span 4; } .span-5 { grid-column: span 5; } .span-7 { grid-column: span 7; } .span-8 { grid-column: span 8; } .span-6 { grid-column: span 6; } .span-12 { grid-column: span 12; }
  @media (max-width: 980px) { .span-4, .span-5, .span-7, .span-8 { grid-column: span 6; } .card[data-id=almanac], .card[data-id=horoscope] { grid-column: span 12; } }
  @media (max-width: 680px) { .grid > .card { grid-column: span 12; } .wrap { padding: 20px 14px 32px; } }
  .card h2 {
    margin: 0 0 14px; font-size: .78rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint);
    display: flex; align-items: center; gap: 8px;
  }
  .card h2 svg { width: 15px; height: 15px; }
  .card h2 { flex-wrap: wrap; }
  .card h2 .h2link { text-transform: none; letter-spacing: 0; font-weight: 600; color: var(--ink-soft); text-decoration: underline; text-underline-offset: 2px; }
  .card h2 .h2link:hover { text-decoration-thickness: 2px; }
  .muted { color: var(--ink-faint); }
  .soft { color: var(--ink-soft); }
  .tiny { font-size: .78rem; }
  .skeleton { color: var(--ink-faint); font-size: .92rem; padding: 18px 0; }

  /* edit mode */
  .card-tools { display: none; position: absolute; top: 12px; right: 12px; gap: 6px; z-index: 2; }
  body.editing .card-tools { display: flex; }
  body.editing .card { outline: 2px dashed rgba(245,158,11,.7); outline-offset: 3px; }
  .card-tools button {
    width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); cursor: pointer;
    display: grid; place-items: center; font-size: .9rem; line-height: 1;
  }
  .card-tools button:hover { background: var(--accent); color: #fff; }

  /* ---------- now ---------- */
  .now-main { display: flex; align-items: center; gap: 18px; }
  .now-icon { width: 92px; height: 92px; flex: none; }
  .now-temp { font-size: 4.2rem; font-weight: 300; line-height: 1; letter-spacing: -0.04em; }
  .now-temp sup { font-size: .38em; font-weight: 500; vertical-align: top; position: relative; top: .35em; margin-left: 2px; letter-spacing: 0; }
  .now-cond { font-size: 1.12rem; font-weight: 600; margin-top: 6px; }
  .now-sub { font-size: .9rem; color: var(--ink-soft); margin-top: 2px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 18px; }
  .stat { background: rgba(255,255,255,.55); border-radius: 14px; padding: 10px 12px; }
  body.dark .stat { background: rgba(255,255,255,.06); }
  .stat .k { font-size: .7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); }
  .stat .v { font-size: 1.05rem; font-weight: 600; margin-top: 3px; white-space: nowrap; }
  @media (max-width: 420px) { .stats, .pollutants { grid-template-columns: repeat(2, 1fr); } }

  /* ---------- hourly ---------- */
  .hourly-svg { width: 100%; height: 190px; display: block; overflow: visible; }
  .hourly-svg text { font-family: inherit; }
  .legend { display: flex; gap: 16px; font-size: .78rem; color: var(--ink-faint); margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

  /* ---------- daily ---------- */
  .day-row { display: grid; grid-template-columns: 58px 30px 44px 1fr 44px 46px; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .day-row:first-of-type { border-top: 0; }
  .day-row .dname { font-weight: 600; }
  .day-row svg.wi { width: 28px; height: 28px; }
  .day-row .lo { text-align: right; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .day-row .hi { font-weight: 600; font-variant-numeric: tabular-nums; }
  .day-row .rain { font-size: .78rem; color: #3b82f6; font-weight: 600; text-align: right; }
  body.dark .day-row .rain { color: #93c5fd; }
  .range { height: 6px; border-radius: 6px; background: var(--line); position: relative; }
  .range span { position: absolute; top: 0; bottom: 0; border-radius: 6px; }

  /* ---------- air ---------- */
  .aqi-wrap { display: flex; align-items: center; gap: 18px; }
  .aqi-ring { width: 118px; height: 118px; flex: none; }
  .aqi-label { font-size: 1.15rem; font-weight: 700; }
  .aqi-note { font-size: .88rem; color: var(--ink-soft); margin-top: 4px; line-height: 1.4; }
  .pollutants { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 16px; }
  .pollen { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
  .pollen-row { display: grid; grid-template-columns: 78px 1fr 64px; gap: 10px; align-items: center; font-size: .86rem; padding: 3px 0; }
  .bar { height: 7px; border-radius: 7px; background: var(--line); overflow: hidden; }
  .bar span { display: block; height: 100%; border-radius: 7px; }

  /* ---------- sun ---------- */
  .sun-svg { width: 100%; height: 132px; display: block; overflow: visible; }
  .sun-times { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .golden { margin-top: 12px; font-size: .86rem; color: var(--ink-soft); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

  /* ---------- moon ---------- */
  .moon-wrap { display: flex; align-items: center; gap: 20px; }
  .moon-svg { width: 112px; height: 112px; flex: none; filter: drop-shadow(0 0 18px rgba(255,248,220,.55)); }
  .moon-name { font-size: 1.2rem; font-weight: 700; }
  .moon-sub { font-size: .9rem; color: var(--ink-soft); margin-top: 3px; }
  .moon-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 16px; }

  /* ---------- dialogs ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(15,23,42,.35); display: none; align-items: flex-start; justify-content: center; padding: 10vh 16px 16px; z-index: 50; }
  .scrim.open { display: flex; }
  .panel {
    width: min(520px, 100%); background: #fff; color: #1f2937; border-radius: 22px; padding: 22px; box-shadow: 0 30px 80px rgba(0,0,0,.25);
    max-height: 80vh; overflow: auto;
  }
  body.dark .panel { background: #0f172a; color: #f1f5f9; }
  .panel h3 { margin: 0 0 14px; font-size: 1.15rem; }
  .panel input[type=text] { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid #d1d5db; background: transparent; outline: none; font-size: 1rem; }
  body.dark .panel input[type=text] { border-color: #334155; }
  .panel input[type=text]:focus { border-color: var(--accent); }
  .results { margin-top: 10px; }
  .result { display: block; width: 100%; text-align: left; padding: 11px 12px; border-radius: 12px; border: 0; background: transparent; cursor: pointer; }
  .result:hover, .result:focus { background: rgba(245,158,11,.12); outline: none; }
  .result small { display: block; color: #6b7280; }
  .row-btns { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .btn { padding: 10px 16px; border-radius: 12px; border: 1px solid #d1d5db; background: transparent; cursor: pointer; font-weight: 600; }
  body.dark .btn { border-color: #334155; }
  .btn.primary { background: #1f2937; color: #fff; border-color: #1f2937; }
  body.dark .btn.primary { background: #f1f5f9; color: #0f172a; border-color: #f1f5f9; }
  .setting { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-top: 1px solid rgba(0,0,0,.07); gap: 12px; }
  body.dark .setting { border-color: rgba(255,255,255,.08); }
  .seg { display: inline-flex; border: 1px solid #d1d5db; border-radius: 10px; overflow: hidden; }
  body.dark .seg { border-color: #334155; }
  .seg button { border: 0; background: transparent; padding: 7px 12px; cursor: pointer; font-weight: 600; font-size: .9rem; }
  .seg button.sel { background: #f59e0b; color: #fff; }
  .hidden-list { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { padding: 6px 12px; border-radius: 999px; border: 1px dashed #9ca3af; background: transparent; cursor: pointer; font-size: .86rem; }

  @media (max-width: 480px) { .pollutants { grid-template-columns: repeat(2, 1fr); } }
  .report-pre { width: 100%; height: 46vh; overflow: auto; margin: 0; padding: 12px; border-radius: 12px; background: rgba(0,0,0,.05); font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }
  body.dark .report-pre { background: rgba(255,255,255,.06); }
  .sky-wrap { display: grid; grid-template-columns: minmax(220px, 250px) 1fr; gap: 22px; align-items: start; }
  .const-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); column-gap: 18px; }
  .const-grid .const-row { border-top: 0; border-bottom: 1px solid var(--line); }
  @media (max-width: 760px) { .sky-wrap { grid-template-columns: 1fr; } }
  .sky-svg { width: 100%; height: auto; display: block; }
  .sky-when { font-weight: 600; margin-bottom: 10px; }
  .const-row { display: grid; grid-template-columns: 24px 1fr; gap: 9px; padding: 9px 0; border-top: 1px solid var(--line); }
  .const-row:first-of-type { border-top: 0; }
  .const-row .num { width: 24px; height: 24px; border-radius: 50%; background: #312e81; color: #fde68a; font-size: .75rem; font-weight: 700; display: grid; place-items: center; }
  .const-row b { font-weight: 700; }
  .const-row .where { color: var(--ink-soft); font-size: .9rem; }
  .const-row .tip { color: var(--ink-faint); font-size: .8rem; margin-top: 1px; line-height: 1.35; }
  .season { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  .season-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font-size: .9rem; }
  .season-next { margin-left: auto; color: var(--ink-soft); }
  .season-bar { margin-top: 7px; height: 6px; }
  .season-bar span { background: linear-gradient(90deg, #f59e0b, #fb7185); }
  .tide-next { display: flex; gap: 12px; align-items: center; }
  .tide-arrow { width: 38px; height: 38px; border-radius: 50%; background: rgba(14,165,233,.14); color: #0284c7; display: grid; place-items: center; font-size: 1.2rem; font-weight: 700; flex: none; }
  body.dark .tide-arrow { color: #7dd3fc; }
  .tide-row { display: grid; grid-template-columns: 52px 1fr auto; gap: 8px; font-size: .88rem; padding: 5px 0; border-top: 1px solid var(--line); }
  .alm-quote { font-style: italic; font-size: .95rem; line-height: 1.45; padding: 4px 0 12px; }
  .alm-row { display: grid; grid-template-columns: 96px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); font-size: .9rem; }
  .alm-row .k { font-size: .7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); padding-top: 3px; }
  .horo-wrap { display: grid; grid-template-columns: minmax(190px, 240px) 1fr; gap: 18px; align-items: center; }
  @media (max-width: 520px) { .horo-wrap { grid-template-columns: 1fr; } .horo-wheel { max-width: 260px; margin: 0 auto; } }
  .horo-wheel { width: 100%; height: auto; display: block; }
  .pl-row { display: grid; grid-template-columns: 22px 70px 1fr; font-size: .86rem; padding: 2px 0; }
  .pl-row .g { font-weight: 700; } .rx { color: #dc2626; font-weight: 700; font-size: .75rem; }
  body.dark .rx { color: #fca5a5; }
  .horo-text { margin-top: 12px; font-size: .9rem; line-height: 1.5; color: var(--ink-soft); }
  .horo-text p { margin: 0 0 6px; }
  .mystic-note { margin-top: 10px; font-size: .74rem; color: var(--ink-faint); font-style: italic; }
  .trow { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  @media (max-width: 680px) { .trow { grid-template-columns: repeat(3, 1fr); } }
  .tslot { margin: 0; text-align: center; }
  .tcard { width: 100%; max-width: 150px; height: auto; display: block; margin: 0 auto 8px; filter: drop-shadow(0 4px 10px rgba(0,0,0,.12)); }
  .tcard.rev { transform: rotate(180deg); }
  .tslot figcaption { display: flex; flex-direction: column; gap: 2px; font-size: .84rem; line-height: 1.3; }
  .tpos { font-size: .68rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  .rising { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); font-size: .84rem; color: var(--ink-soft); }
  .rising .k { font-size: .7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); }
  .horo-text.cols { columns: 2; column-gap: 22px; }
  .horo-text.cols p { break-inside: avoid; }
  @media (max-width: 980px) { .horo-text.cols { columns: 1; } }
  .aqi-strip { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; align-items: end; height: 34px; margin-top: 6px; }
  .aqi-strip span { border-radius: 2px; min-height: 3px; }
  .moon-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 14px; text-align: center; font-size: .7rem; font-weight: 700; color: var(--ink-faint); }
  .mw-ic .moon-svg { width: 100%; max-width: 30px; height: auto; filter: none; margin: 0 auto 2px; display: block; }
  .camps { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  .camps-h { font-size: .74rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 4px; }
  .camps-h span { text-transform: none; letter-spacing: 0; font-weight: 500; }
  .camp { display: flex; flex-direction: column; padding: 5px 8px; margin: 0 -8px; border-radius: 10px; color: inherit; text-decoration: none; font-size: .88rem; line-height: 1.3; }
  .camp b, .camp span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .camp:hover { background: rgba(245,158,11,.12); }
  footer { margin-top: 28px; text-align: center; font-size: .78rem; color: var(--ink-faint); }
  footer a { color: inherit; }
  .error { color: #b91c1c; font-size: .9rem; }
  body.dark .error { color: #fca5a5; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="clock-block">
      <div class="greeting" id="greeting">Hello</div>
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date"></div>
    </div>
    <div class="top-right">
      <button class="place-btn" id="placeBtn" title="Change location">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
        <span id="placeName">Choose a city</span>
      </button>
      <div class="tool-row">
        <button class="icon-btn" id="refreshBtn" title="Refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>
        <button class="icon-btn" id="editBtn" title="Arrange widgets">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
        </button>
        <button class="icon-btn" id="settingsBtn" title="Settings">

<script src="tarot-cards.js"></script>
<script>
(() => {
  "use strict";

  /* =========================================================
     Storage (safe wrappers)
     ========================================================= */
  const store = {
    get(k, d) { try { const v = localStorage.getItem("daylight:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("daylight:" + k, JSON.stringify(v)); } catch (e) {} }
  };

  const usLocale = /^en-US/i.test(navigator.language || "") || /^en-US/i.test((navigator.languages || [])[0] || "");
  const DEFAULT_PLACE = { name: "Washington", region: "District of Columbia, United States", lat: 38.9072, lon: -77.0369, tz: "America/New_York" };
  const WIDGETS = [
    { id: "now",    title: "Right now",       span: "span-5" },
    { id: "hourly", title: "Next 24 hours",   span: "span-7" },
    { id: "daily",  title: "7-day forecast",  span: "span-5" },
    { id: "air",    title: "Air quality",     span: "span-7" },
    { id: "sun",    title: "Sun",             span: "span-6" },
    { id: "moon",   title: "Moon",            span: "span-6" },
    { id: "tides",  title: "Tides",           span: "span-6" },
    { id: "sky",    title: "Night sky",       span: "span-12" },
    { id: "almanac", title: "Almanac",        span: "span-4" },
    { id: "horoscope", title: "Sky horoscope", span: "span-8" },
    { id: "tarot",  title: "Today's Global Tarot Draw", span: "span-12",
      link: { text: "(Click Here for FREE Personalized Reading)", href: "/tarot-table/" } }
  ];

  const state = {
    place: store.get("place", DEFAULT_PLACE),
    firstRun: store.get("place", null) === null,
    units: store.get("units", usLocale ? "f" : "c"),
    clock: store.get("clock", usLocale ? "12" : "24"),
    theme: store.get("theme", "auto"),
    engine: store.get("engine", "ddg"),
    order: store.get("order", WIDGETS.map(w => w.id)),
    hidden: store.get("hidden", []),
    wx: store.get("wx", null),     // cached weather response
    aq: store.get("aq", null),     // cached air response
    fetchedAt: store.get("fetchedAt", 0),
    tide: store.get("tide", null),
    camps: store.get("camps", null),
    error: null
  };
  // make sure any newly added widget ids appear in the order list
  WIDGETS.forEach((w, i) => {
    if (state.order.includes(w.id)) return;
    const prev = WIDGETS[i - 1] && state.order.indexOf(WIDGETS[i - 1].id);
    if (prev != null && prev >= 0) state.order.splice(prev + 1, 0, w.id); else state.order.push(w.id);
  });
  state.order = state.order.filter(id => WIDGETS.some(w => w.id === id));

  const $ = s => document.querySelector(s);
  const el = (tag, attrs = {}, html = "") => { const n = document.createElement(tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (html) n.innerHTML = html; return n; };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  /* =========================================================
     Astronomy (sun & moon) — standard low-precision formulas
     ========================================================= */
  const astro = (() => {
    const PI = Math.PI, rad = PI / 180, dayMs = 864e5, J1970 = 2440588, J2000 = 2451545, e = rad * 23.4397;
    const toJulian = d => d.valueOf() / dayMs - 0.5 + J1970;
    const fromJulian = j => new Date((j + 0.5 - J1970) * dayMs);
    const toDays = d => toJulian(d) - J2000;
    const rightAscension = (l, b) => Math.atan2(Math.sin(l) * Math.cos(e) - Math.tan(b) * Math.sin(e), Math.cos(l));
    const declination = (l, b) => Math.asin(Math.sin(b) * Math.cos(e) + Math.cos(b) * Math.sin(e) * Math.sin(l));
    const azimuth = (H, phi, dec) => Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(phi) - Math.tan(dec) * Math.cos(phi));
    const altitude = (H, phi, dec) => Math.asin(Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(H));
    const siderealTime = (d, lw) => rad * (280.16 + 360.9856235 * d) - lw;
    const solarMeanAnomaly = d => rad * (357.5291 + 0.98560028 * d);
    const eclipticLongitude = M => {
      const C = rad * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M));
      return M + C + rad * 102.9372 + PI;
    };
    const sunCoords = d => { const L = eclipticLongitude(solarMeanAnomaly(d)); return { dec: declination(L, 0), ra: rightAscension(L, 0) }; };

    function sunPosition(date, lat, lng) {
      const lw = rad * -lng, phi = rad * lat, d = toDays(date), c = sunCoords(d), H = siderealTime(d, lw) - c.ra;
      return { altitude: altitude(H, phi, c.dec) / rad, azimuth: azimuth(H, phi, c.dec) / rad + 180 };
    }

    const J0 = 0.0009;
    const julianCycle = (d, lw) => Math.round(d - J0 - lw / (2 * PI));
    const approxTransit = (Ht, lw, n) => J0 + (Ht + lw) / (2 * PI) + n;
    const solarTransitJ = (ds, M, L) => J2000 + ds + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
    const hourAngle = (h, phi, d) => Math.acos((Math.sin(h) - Math.sin(phi) * Math.sin(d)) / (Math.cos(phi) * Math.cos(d)));

    // date should be around local solar noon of the wanted day
    function sunTimes(date, lat, lng) {
      const lw = rad * -lng, phi = rad * lat, d = toDays(date), n = julianCycle(d, lw), ds = approxTransit(0, lw, n);
      const M = solarMeanAnomaly(ds), L = eclipticLongitude(M), dec = declination(L, 0), Jnoon = solarTransitJ(ds, M, L);
      const out = { noon: fromJulian(Jnoon) };
      const pairs = [[-0.833, "sunrise", "sunset"], [-6, "dawn", "dusk"], [6, "goldenEnd", "golden"]];
      for (const [h, riseName, setName] of pairs) {
        const w = hourAngle(h * rad, phi, dec);
        if (isNaN(w)) { out[riseName] = null; out[setName] = null; continue; }
        const Jset = solarTransitJ(approxTransit(w, lw, n), M, L), Jrise = Jnoon - (Jset - Jnoon);
        out[riseName] = fromJulian(Jrise); out[setName] = fromJulian(Jset);
      }
      // polar day / night flag
      const noonAlt = 90 - Math.abs(lat - dec / rad);
      out.polar = out.sunrise ? null : (noonAlt > 0 ? "day" : "night");
      return out;
    }

    function moonCoords(d) {
      const L = rad * (218.316 + 13.176396 * d), M = rad * (134.963 + 13.064993 * d), F = rad * (93.272 + 13.229350 * d);
      const l = L + rad * 6.289 * Math.sin(M), b = rad * 5.128 * Math.sin(F), dt = 385001 - 20905 * Math.cos(M);
      return { ra: rightAscension(l, b), dec: declination(l, b), dist: dt };
    }
    function moonAltitude(date, lat, lng) {
      const lw = rad * -lng, phi = rad * lat, d = toDays(date), c = moonCoords(d), H = siderealTime(d, lw) - c.ra;
      return altitude(H, phi, c.dec) / rad;
    }
    function moonIllumination(date) {
      const d = toDays(date || new Date()), s = sunCoords(d), m = moonCoords(d), sdist = 149598000;
      const phi = Math.acos(Math.sin(s.dec) * Math.sin(m.dec) + Math.cos(s.dec) * Math.cos(m.dec) * Math.cos(s.ra - m.ra));
      const inc = Math.atan2(sdist * Math.sin(phi), m.dist - sdist * Math.cos(phi));
      const angle = Math.atan2(Math.cos(s.dec) * Math.sin(s.ra - m.ra), Math.sin(s.dec) * Math.cos(m.dec) - Math.cos(s.dec) * Math.sin(m.dec) * Math.cos(s.ra - m.ra));
      return { fraction: (1 + Math.cos(inc)) / 2, phase: 0.5 + 0.5 * inc * (angle < 0 ? -1 : 1) / PI, dist: m.dist };
    }
    // rise/set by sampling altitude every 10 minutes across [start, start+24h)
    function moonTimes(start, lat, lng) {
      const step = 10 * 60e3, horizon = 0.133; let rise = null, set = null;
      let prevT = start.valueOf(), prev = moonAltitude(start, lat, lng) - horizon;
      for (let t = prevT + step; t <= start.valueOf() + dayMs; t += step) {
        const a = moonAltitude(new Date(t), lat, lng) - horizon;
        if (prev < 0 && a >= 0 && !rise) rise = new Date(prevT + step * (-prev / (a - prev)));
        if (prev >= 0 && a < 0 && !set) set = new Date(prevT + step * (prev / (prev - a)));
        prev = a; prevT = t;
      }
      return { rise, set };
    }
    // next time the phase passes a target (0 = new, 0.5 = full)
    function nextPhase(from, target) {
      const hour = 36e5; let t = from.valueOf(), p0 = moonIllumination(new Date(t)).phase;
      for (let i = 0; i < 24 * 31; i++) {
        const t1 = t + hour, p1 = moonIllumination(new Date(t1)).phase;
        const crossed = target === 0 ? (p1 < p0 - 0.5) : (p0 < target && p1 >= target);
        if (crossed) return new Date(t1);
        t = t1; p0 = p1;
      }
      return null;
    }
    // alt/az (degrees, azimuth from north) of a fixed star given RA in hours and Dec in degrees
    function starPosition(raH, decD, date, lat, lng) {
      const lw = rad * -lng, phi = rad * lat, d = toDays(date), H = siderealTime(d, lw) - raH * 15 * rad, dec = decD * rad;
      return { altitude: altitude(H, phi, dec) / rad, azimuth: (azimuth(H, phi, dec) / rad + 180 + 360) % 360 };
    }
    function moonPosition(date, lat, lng) {
      const lw = rad * -lng, phi = rad * lat, d = toDays(date), c = moonCoords(d), H = siderealTime(d, lw) - c.ra;
      return { altitude: altitude(H, phi, c.dec) / rad, azimuth: (azimuth(H, phi, c.dec) / rad + 180 + 360) % 360 };
    }
    return { sunPosition, sunTimes, moonIllumination, moonTimes, moonAltitude, nextPhase, starPosition, moonPosition };
  })();

  /* =========================================================
     Time helpers (show times in the chosen city's time zone)
     ========================================================= */
  const tz = () => state.place.tz || Intl.DateTimeFormat().resolvedOptions().timeZone;
  const hour12 = () => state.clock === "12";
  function fmtTime(d, zone) {
    if (!d) return "—";
    return new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit", hour12: hour12(), timeZone: zone || tz() }).format(d);
  }
  function fmtHour(d) {
    return new Intl.DateTimeFormat(undefined, { hour: "numeric", hour12: hour12(), timeZone: tz() }).format(d).replace(":00", "").replace(" ", "").toLowerCase();
  }
  function zoneParts(d, zone) {
    const parts = new Intl.DateTimeFormat("en-US", { timeZone: zone, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" }).formatToParts(d);
    const o = {}; parts.forEach(p => o[p.type] = +p.value || p.value); return o;
  }
  // milliseconds the zone is ahead of UTC at instant d
  function zoneOffset(d, zone) {
    const p = zoneParts(d, zone);
    return Date.UTC(p.year, p.month - 1, p.day, p.hour % 24, p.minute, p.second) - Math.floor(d.valueOf() / 1000) * 1000;
  }
  // the instant of local midnight / noon for the zone's current date (+dayShift)
  function zoneDayInstant(d, zone, hour, dayShift = 0) {
    const p = zoneParts(d, zone);
    const guess = Date.UTC(p.year, p.month - 1, p.day + dayShift, hour, 0, 0);
    return new Date(guess - zoneOffset(new Date(guess), zone));
  }
  const fmtDuration = ms => { const m = Math.round(ms / 60e3); return `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m`; };

  /* =========================================================
     Weather codes + icons
     ========================================================= */
  const WMO = {
    0: ["Clear", "clear"], 1: ["Mostly clear", "clear"], 2: ["Partly cloudy", "partly"], 3: ["Overcast", "cloud"],
    45: ["Fog", "fog"], 48: ["Freezing fog", "fog"],
    51: ["Light drizzle", "drizzle"], 53: ["Drizzle", "drizzle"], 55: ["Heavy drizzle", "drizzle"], 56: ["Freezing drizzle", "drizzle"], 57: ["Freezing drizzle", "drizzle"],
    61: ["Light rain", "rain"], 63: ["Rain", "rain"], 65: ["Heavy rain", "rain"], 66: ["Freezing rain", "rain"], 67: ["Freezing rain", "rain"],
    71: ["Light snow", "snow"], 73: ["Snow", "snow"], 75: ["Heavy snow", "snow"], 77: ["Snow grains", "snow"],
    80: ["Light showers", "rain"], 81: ["Showers", "rain"], 82: ["Heavy showers", "rain"], 85: ["Snow showers", "snow"], 86: ["Heavy snow showers", "snow"],
    95: ["Thunderstorm", "storm"], 96: ["Thunderstorm, hail", "storm"], 99: ["Thunderstorm, hail", "storm"]
  };
  const wmo = c => WMO[c] || ["—", "cloud"];
  function icon(kind, night) {
    const sun = `<circle cx="32" cy="32" r="11" fill="#fbbf24"/><g stroke="#fbbf24" stroke-width="4" stroke-linecap="round"><path d="M32 9v6M32 49v6M9 32h6M49 32h6M15.7 15.7l4.2 4.2M44.1 44.1l4.2 4.2M15.7 48.3l4.2-4.2M44.1 19.9l4.2-4.2"/></g>`;
    const moon = `<path d="M40 12a20 20 0 1 0 12 30A16 16 0 0 1 40 12z" fill="#fde68a"/>`;
    const cloud = (x = 0, y = 0, fill = "#f8fafc", stroke = "#94a3b8") => `<path transform="translate(${x} ${y})" d="M20 50h26a10 10 0 0 0 0-20 14 14 0 0 0-27-2A11 11 0 0 0 20 50z" fill="${fill}" stroke="${stroke}" stroke-width="2.5" stroke-linejoin="round"/>`;
    const smallSky = night ? `<g transform="translate(-6 -8) scale(.7)">${moon}</g>` : `<g transform="translate(-4 -6) scale(.72)">${sun}</g>`;
    const drops = (n, color) => Array.from({ length: n }, (_, i) => `<path d="M${22 + i * 9} 54l-3 7" stroke="${color}" stroke-width="3.2" stroke-linecap="round"/>`).join("");
    const flakes = n => Array.from({ length: n }, (_, i) => `<circle cx="${23 + i * 9}" cy="${57 + (i % 2) * 3}" r="2.6" fill="#93c5fd"/>`).join("");
    let body;
    switch (kind) {
      case "clear": body = night ? `<g transform="translate(2 2)">${moon}</g>` : sun; break;
      case "partly": body = smallSky + cloud(4, 2); break;
      case "cloud": body = cloud(-6, -6, "#e2e8f0") + cloud(2, 2); break;
      case "fog": body = cloud(0, -6) + `<g stroke="#94a3b8" stroke-width="3" stroke-linecap="round"><path d="M14 52h36M20 58h28"/></g>`; break;
      case "drizzle": body = cloud(0, -6) + drops(3, "#60a5fa"); break;
      case "rain": body = cloud(0, -6, "#e2e8f0", "#64748b") + drops(4, "#3b82f6"); break;
      case "snow": body = cloud(0, -6) + flakes(4); break;
      case "storm": body = cloud(0, -6, "#cbd5e1", "#475569") + `<path d="M34 46l-7 10h7l-4 9 10-13h-7l4-6z" fill="#facc15"/>`; break;
      default: body = cloud(0, 0);
    }
    return `<svg class="wi" viewBox="0 0 64 64" aria-hidden="true">${body}</svg>`;
  }

  /* =========================================================
     Units
     ========================================================= */
  const tempU = () => state.units === "f" ? "°F" : "°C";
  const T = c => c == null ? "—" : Math.round(state.units === "f" ? c * 9 / 5 + 32 : c);
  const wind = kmh => state.units === "f" ? `${Math.round(kmh / 1.609)} mph` : `${Math.round(kmh)} km/h`;
  const rainAmt = mm => state.units === "f" ? `${(mm / 25.4).toFixed(2)} in` : `${mm.toFixed(1)} mm`;
  const compass = deg => ["N", "NE", "E", "SE", "S", "SW", "W", "NW"][Math.round(((deg % 360) + 360) % 360 / 45) % 8];

  /* =========================================================
     Data fetching (Open-Meteo, no key needed)
     ========================================================= */
  async function getJSON(url) {
    const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), 12000);
    try {
      const r = await fetch(url, { signal: ctrl.signal });
      if (!r.ok) throw new Error("HTTP " + r.status);
      return await r.json();
    } finally { clearTimeout(timer); }
  }
  async function refresh(force) {
    const p = state.place;
    if (!force && state.wx && state.wx._key === key(p) && Date.now() - state.fetchedAt < 10 * 60e3) { renderAll(); loadTides().then(renderAll); loadCamps().then(renderAll); return; }
    const wxURL = `https://api.open-meteo.com/v1/forecast?latitude=${p.lat}&longitude=${p.lon}&timezone=auto&forecast_days=7` +
      `&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m` +
      `&hourly=temperature_2m,precipitation_probability,weather_code,is_day,uv_index` +
      `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,uv_index_max`;
    const aqURL = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${p.lat}&longitude=${p.lon}&timezone=auto` +
      `&current=us_aqi,pm2_5,pm10,ozone,nitrogen_dioxide,alder_pollen,birch_pollen,grass_pollen,mugwort_pollen,olive_pollen,ragweed_pollen` +
      `&hourly=us_aqi&forecast_days=2`;
    $("#updated").textContent = "Updating…";
    const [wx, aq] = await Promise.allSettled([getJSON(wxURL), getJSON(aqURL)]);
    state.error = null;
    if (wx.status === "fulfilled") {
      state.wx = wx.value; state.wx._key = key(p);
      if (state.wx.timezone && state.wx.timezone !== "GMT") { state.place.tz = state.wx.timezone; store.set("place", state.place); }
      store.set("wx", state.wx);
    } else state.error = "Couldn't reach the weather service. Showing the last saved data.";
    if (aq.status === "fulfilled") { state.aq = aq.value; state.aq._key = key(p); store.set("aq", state.aq); }
    if (wx.status === "fulfilled") { state.fetchedAt = Date.now(); store.set("fetchedAt", state.fetchedAt); }
    renderAll();
    loadTides().then(renderAll);
    loadCamps().then(renderAll);
  }
  const key = p => `${(+p.lat).toFixed(3)},${(+p.lon).toFixed(3)}`;
  const wxReady = () => state.wx && state.wx._key === key(state.place);

  /* ---------- seasons ---------- */
  function seasonMarks(year) {

      2451716.56767 + 365241.62603 * Y + 0.00325 * Y * Y + 0.00888 * Y ** 3 - 0.00030 * Y ** 4,
      2451810.21715 + 365242.01767 * Y - 0.11575 * Y * Y + 0.00337 * Y ** 3 + 0.00078 * Y ** 4,
      2451900.05952 + 365242.74049 * Y - 0.06223 * Y * Y - 0.00823 * Y ** 3 + 0.00032 * Y ** 4];

  }
  function seasonInfo(now, lat) {

    const i = marks.findIndex(m => m > now), start = marks[i - 1], next = marks[i];
    const north = lat >= 0, k = (i - 1) % 4;                   // index of the season that just began
    const NAMES_N = ["Spring", "Summer", "Autumn", "Winter"], NAMES_S = ["Autumn", "Winter", "Spring", "Summer"];
    const EVENTS = ["March equinox", "June solstice", "September equinox", "December solstice"];
    const nextK = i % 4, nextSeason = (north ? NAMES_N : NAMES_S)[nextK];
    const eventLabel = (nextK % 2 ? (nextSeason === "Summer" ? "Summer solstice" : "Winter solstice") : (nextSeason === "Spring" ? "Spring equinox" : "Autumn equinox"));
    return { season: (north ? NAMES_N : NAMES_S)[k], frac: (now - start) / (next - start), next, eventLabel, event: EVENTS[nextK], days: Math.ceil((next - now) / 864e5), marks: marks.slice(4, 8) };
  }
  function dayLengthOn(date, p) { const t = astro.sunTimes(zoneDayInstant(date, tz(), 12), p.lat, p.lon); return t.sunrise ? t.sunset - t.sunrise : null; }
  function seasonStrip() {

    const today = dayLengthOn(now, p), yest = dayLengthOn(new Date(now - 864e5), p);
    const delta = today != null && yest != null ? Math.round((today - yest) / 1000) : null;
    const trend = delta == null ? "" : `${delta >= 0 ? "Gaining" : "Losing"} ${Math.floor(Math.abs(delta) / 60) ? Math.floor(Math.abs(delta) / 60) + "m " : ""}${Math.abs(delta) % 60}s of daylight a day`;

        <div class="tiny muted" style="margin-top:6px">${si.days} day${si.days === 1 ? "" : "s"} to go${trend ? " · " + esc(trend.toLowerCase()) : ""}</div>
      </div>`;
  }
  function wSun() {

      const lon = id === "sun" ? planets.sunLongitude(d) : id === "moon" ? planets.moonLongitude(d) : planets.longitude(id, d);
      let retro = false;
      if (id !== "sun" && id !== "moon") { const l2 = planets.longitude(id, new Date(d.valueOf() + 864e5)); retro = ((l2 - lon + 540) % 360 - 180) < 0; }
      return { id, label, glyph, rules, lon, sign: Math.floor(lon / 30), deg: lon % 30, retro };
    });
    const asp = [];
    for (let i = 0; i < pos.length; i++) for (let j = i + 1; j < pos.length; j++) {
      const a = pos[i], b = pos[j]; if (i >= 7 && j >= 7) continue;   // skip slow outer-planet pairs that last for years
      const sep = Math.abs(((a.lon - b.lon + 540) % 360) - 180), ang = 180 - sep;
      for (const [deg, orb, name, verb, color] of ASPECTS) if (Math.abs(ang - deg) <= orb) asp.push({ a, b, name, verb, color, orb: Math.abs(ang - deg) });
    }
    asp.sort((x, y) => x.orb - y.orb);

  function horoscopeText(ch) {
    const sun = ch.pos[0], moon = ch.pos[1], ill = astro.moonIllumination(new Date());
    const lines = [];
    lines.push(`The Sun in ${SIGNS[sun.sign]} puts the season's focus on ${SIGN_FOCUS[sun.sign]}.`);
    lines.push(`With the Moon in ${SIGNS[moon.sign]}, the mood is ${MOON_MOOD[moon.sign]}.`);
    const phase = ill.phase < 0.5 ? "waxing, a time for building and beginning" : "waning, a time for finishing and letting go";
    lines.push(`The Moon is ${phase}.`);
    ch.asp.slice(0, 3).forEach(x => lines.push(`${x.a.label} ${x.verb} ${x.b.label}, linking ${x.a.rules} with ${x.b.rules}.`));
    const rx = ch.pos.filter(p => p.retro && RETRO_NOTE[p.id]);
    if (rx.length) lines.push(`Retrograde: ${rx.map(p => `${p.label} (${RETRO_NOTE[p.id]})`).join("; ")}.`);

  function wHoroscope() {
    const ch = skyChart(), S = 300, C = 150, R1 = 140, R2 = 112, R3 = 84;
    const pt = (lon, r) => { const a = (180 - lon) * Math.PI / 180; return [C + r * Math.cos(a), C - r * Math.sin(a)]; };   // 0° Aries at the left, counter-clockwise
    let wheel = `<circle cx="${C}" cy="${C}" r="${R1}" fill="none" stroke="currentColor" stroke-opacity=".25"/><circle cx="${C}" cy="${C}" r="${R2}" fill="none" stroke="currentColor" stroke-opacity=".25"/><circle cx="${C}" cy="${C}" r="${R3}" fill="none" stroke="currentColor" stroke-opacity=".15"/>`;
    for (let i = 0; i < 12; i++) {
      const [x1, y1] = pt(i * 30, R2), [x2, y2] = pt(i * 30, R1), [gx, gy] = pt(i * 30 + 15, (R1 + R2) / 2);
      wheel += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="currentColor" stroke-opacity=".25"/><text x="${gx}" y="${gy + 5}" text-anchor="middle" font-size="17" fill="${["#ef4444", "#16a34a", "#0ea5e9", "#6366f1"][i % 4]}">${SIGN_GLYPH[i]}</text>`;
    }
    ch.asp.forEach(x => { const [x1, y1] = pt(x.a.lon, R3), [x2, y2] = pt(x.b.lon, R3); wheel += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${x.color}" stroke-opacity=".55" stroke-width="1.3"/>`; });
    // spread planets that sit on top of each other
    const placed = [...ch.pos].sort((a, b) => a.lon - b.lon).map(p => ({ p, at: p.lon }));
    for (let k = 0; k < 3; k++) for (let i = 1; i < placed.length; i++) if (placed[i].at - placed[i - 1].at < 11) placed[i].at = placed[i - 1].at + 11;
    placed.forEach(({ p, at }) => {
      const [x, y] = pt(at, (R2 + R3) / 2 + 2), [tx, ty] = pt(p.lon, R3);
      wheel += `<circle cx="${tx}" cy="${ty}" r="2" fill="currentColor" opacity=".5"/><text x="${x}" y="${y + 7}" text-anchor="middle" font-size="19" font-weight="700" fill="currentColor">${p.glyph}</text>${p.retro ? `<text x="${x + 9}" y="${y + 12}" font-size="8" font-weight="700" fill="#ef4444">R</text>` : ""}`;
    });
    const list = ch.pos.map(p => `<div class="pl-row"><span class="g">${p.glyph}</span><span>${p.label}</span><span class="soft">${SIGNS[p.sign]} ${Math.floor(p.deg)}°${p.retro ? " <span class=\"rx\">Rx</span>" : ""}</span></div>`).join("");
    return `<div class="horo-wrap">
        <svg viewBox="0 0 ${S} ${S}" class="horo-wheel" style="color:var(--ink)" role="img" aria-label="Today's sky chart">${wheel}</svg>
        <div class="pl-list">${list}</div>
      </div>
      <div class="horo-text cols">${horoscopeText(ch).map(l => `<p>${esc(l)}</p>`).join("")}</div>

  }

  /* ---------- daily tarot (5-card spread) ---------- */
  const SPREAD = ["The day's theme", "What helps", "What challenges", "Advice", "Where it's heading"];
  const SUIT = { wands: ["♣", "#ea580c", "energy, work and ambition"], cups: ["♥", "#2563eb", "feelings and relationships"], swords: ["♠", "#64748b", "thoughts, decisions and conflict"], pentacles: ["♦", "#ca8a04", "money, body and practical matters"] };
  function tarotDraw() {
    const rnd = seededRandom("tarot" + localDateKey()), deck = TAROT.map((c, i) => i);
    for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
    return deck.slice(0, 5).map((i, k) => ({ ...TAROT[i], reversed: rnd() < 0.3, pos: SPREAD[k] }));
  }
  const firstKw = s => s.split(",")[0].trim();
  function tarotReading(cards) {
    const majors = cards.filter(c => c.arcana === "major").length, rev = cards.filter(c => c.reversed).length;
    const suits = {}; cards.forEach(c => c.suit && (suits[c.suit] = (suits[c.suit] || 0) + 1));
    const top = Object.entries(suits).sort((a, b) => b[1] - a[1])[0];
    const out = [];
    out.push(majors >= 3 ? `With ${majors} Major Arcana cards, this is read as a day where bigger forces and turning points are in play.`
      : majors === 0 ? "No Major Arcana appear, so the day is read as down-to-earth: everyday choices matter more than fate."
      : `${majors === 1 ? "One Major Arcana card" : "Two Major Arcana cards"} mark${majors === 1 ? "s" : ""} where the day's real weight lies.`);
    const NUMW = ["", "One", "Two", "Three", "Four", "Five"];
    if (top && top[1] >= 2) out.push(`${NUMW[top[1]]} ${top[0][0].toUpperCase() + top[0].slice(1)} cards point the day toward ${SUIT[top[0]][2]}.`);
    if (rev >= 3) out.push("Several reversed cards suggest delays, second thoughts or energy turned inward.");
    const [t, h, ch, adv, end] = cards;
    const kw = c => c.reversed ? firstKw(c.rev) : firstKw(c.up);
    out.push(`The theme is ${t.reversed ? "a blocked or inward version of " : ""}${t.phrase} (${t.name}${t.reversed ? ", reversed" : ""}).`);
    const R = c => c.reversed ? " (reversed)" : "";
    out.push(h.reversed ? `Help comes from facing ${kw(h)} head-on (${h.name}, reversed).` : `${h.name} is on your side: lean on ${kw(h)}.`);
    out.push(`The friction comes from ${ch.name}${R(ch)}, so watch for ${kw(ch)}.`);
    out.push(adv.reversed ? `The advice card, ${adv.name} reversed, warns against ${kw(adv)}.` : `The advice card, ${adv.name}, says to focus on ${kw(adv)}.`);
    out.push(end.reversed ? `Left unchecked, things could drift toward ${kw(end)} (${end.name}, reversed), so the advice matters.` : `If you follow it, the day is heading toward ${kw(end)} (${end.name}).`);
    return out;
  }
  const tarotCardSVG = c => TarotCards.cardSVG(TAROT.find(d => d.name === c.name)).replace('class="tarot-card"', `class="tcard${c.reversed ? " rev" : ""}"`);
  function wTarot() {
    const cards = tarotDraw();
    const row = cards.map(c => `<figure class="tslot">${tarotCardSVG(c)}<figcaption><span class="tpos">${esc(c.pos)}</span><b>${esc(c.name)}${c.reversed ? " ↺" : ""}</b><span class="tiny muted">${esc(c.reversed ? c.rev : c.up)}</span></figcaption></figure>`).join("");

  const RENDER = { now: wNow, hourly: wHourly, daily: wDaily, air: wAir, sun: wSun, moon: wMoon, tides: wTides, sky: wSky, almanac: wAlmanac, horoscope: wHoroscope, tarot: wTarot };

  /* =========================================================

  // widgets that actually appear: not hidden by the user, and tides only near a tide station

  function renderAll() {

  /* =========================================================

  const SEQ = ["left", "left", "right", "right", "up", "down", "up", "down"];
  let seqPos = 0;
  function pushDir(dir) {

  }
  document.addEventListener("keydown", e => {

  }, { passive: true });

  function buildReport() {
    const p = state.place, zone = tz(), now = new Date(), u = tempU();

        `Today high / low: ${T(d.temperature_2m_max[0])}${u} / ${T(d.temperature_2m_min[0])}${u}`,

        `Wind:             ${wind(c.wind_speed_10m)} from the ${compass(c.wind_direction_10m)} (${Math.round(c.wind_direction_10m)}°), gusts ${wind(c.wind_gusts_10m)}`,
        `Precipitation:    ${rainAmt(c.precipitation)} in the last hour`,

      out.push("NEXT 24 HOURS", sub, `${pad("Time", 10)}${pad("Temp", 8)}${pad("Rain", 7)}${pad("UV", 6)}Conditions`);

        const t = new Date(Date.parse(h.time[i] + ":00Z") - offs);
        out.push(`${pad(fmtTime(t), 10)}${pad(T(h.temperature_2m[i]) + u, 8)}${pad((h.precipitation_probability[i] ?? 0) + "%", 7)}${pad(h.uv_index[i] == null ? "-" : h.uv_index[i].toFixed(1), 6)}${wmo(h.weather_code[i])[0]}`);
      }
      out.push("");

      out.push("7-DAY FORECAST", sub, `${pad("Day", 16)}${pad("High", 8)}${pad("Low", 8)}${pad("Rain", 7)}${pad("Amount", 10)}${pad("UV", 6)}Conditions`);
      d.time.forEach((day, i) => {
        const name = new Intl.DateTimeFormat("en-US", { weekday: "short", month: "short", day: "numeric", timeZone: "UTC" }).format(new Date(day + "T12:00:00Z"));
        out.push(`${pad(name, 16)}${pad(T(d.temperature_2m_max[i]) + u, 8)}${pad(T(d.temperature_2m_min[i]) + u, 8)}${pad((d.precipitation_probability_max[i] ?? 0) + "%", 7)}${pad(rainAmt(d.precipitation_sum[i] ?? 0), 10)}${pad(d.uv_index_max[i] == null ? "-" : d.uv_index_max[i].toFixed(1), 6)}${wmo(d.weather_code[i])[0]}`);

    } else out.push("Weather data was not available when this summary was made.", "");

    out.push("AIR QUALITY", sub);

      out.push("POLLEN", sub);
      const pk = [["Grass", "grass_pollen"], ["Birch", "birch_pollen"], ["Alder", "alder_pollen"], ["Ragweed", "ragweed_pollen"], ["Mugwort", "mugwort_pollen"], ["Olive", "olive_pollen"]];

    } else out.push("Air quality data was not available when this summary was made.", "");

    const noon = zoneDayInstant(now, zone, 12), st = astro.sunTimes(noon, p.lat, p.lon), sy = astro.sunTimes(zoneDayInstant(now, zone, 12, -1), p.lat, p.lon);
    const pos = astro.sunPosition(now, p.lat, p.lon);
    out.push("SUN", sub);
    if (st.polar) out.push(st.polar === "day" ? "Midnight sun: the sun does not set today." : "Polar night: the sun does not rise today.");
    else {
      const len = st.sunset - st.sunrise, lenY = sy.sunset - sy.sunrise, diff = Math.round((len - lenY) / 1000);
      out.push(`Dawn (civil):        ${fmtTime(st.dawn)}`, `Sunrise:             ${fmtTime(st.sunrise)}`,
        `Morning golden hour: ${fmtTime(st.sunrise)} - ${fmtTime(st.goldenEnd)}`, `Solar noon:          ${fmtTime(st.noon)}`,
        `Evening golden hour: ${fmtTime(st.golden)} - ${fmtTime(st.sunset)}`, `Sunset:              ${fmtTime(st.sunset)}`,
        `Dusk (civil):        ${fmtTime(st.dusk)}`, `Day length:          ${fmtDuration(len)} (${diff >= 0 ? "+" : "-"}${Math.floor(Math.abs(diff) / 60)}m ${Math.abs(diff) % 60}s vs yesterday)`);
    }
    out.push(`Sun right now:       ${pos.altitude.toFixed(1)}° altitude, ${pos.azimuth.toFixed(0)}° azimuth (${compass(pos.azimuth)})`, "");

    const m = astro.moonIllumination(now), mt = astro.moonTimes(zoneDayInstant(now, zone, 0), p.lat, p.lon);
    const full = astro.nextPhase(now, 0.5), nw = astro.nextPhase(now, 0);
    const dd = x => x ? new Intl.DateTimeFormat("en-US", { weekday: "short", month: "short", day: "numeric", year: "numeric", timeZone: zone }).format(x) : "n/a";
    out.push("MOON", sub,
      `Phase:          ${PHASES.find(x => m.phase < x[0])[1]} (cycle position ${(m.phase * 100).toFixed(1)}%)`,
      `Illuminated:    ${(m.fraction * 100).toFixed(1)}%`,
      `Distance:       ${Math.round(m.dist).toLocaleString("en-US")} km`,
      `Moonrise:       ${mt.rise ? fmtTime(mt.rise) : "none today"}`,
      `Moonset:        ${mt.set ? fmtTime(mt.set) : "none today"}`,
      `Next full moon: ${dd(full)}`,
      `Next new moon:  ${dd(nw)}`, "");

    if (tidesReady()) {
      const td = state.tide, up = td.events.filter(e => e.t > Date.now()).slice(0, 6);
      out.push("TIDES", sub, `Station: ${stationLabel(td.station)} (NOAA ${td.station.id}, ${Math.round(td.station.km)} km away)`);
      const lv = tideLevel(td.events, Date.now()); if (lv != null) out.push(`Now:     ${ftOrM(lv)}, ${up[0] && up[0].type === "H" ? "rising" : "falling"}`);
      up.forEach(e => out.push(`  ${e.type === "H" ? "High" : "Low "}  ${fmtTime(new Date(e.t)).padEnd(9)} ${ftOrM(e.ft)}`));
      out.push("Heights are above mean lower low water (MLLW).", "");
    }
    { const si = seasonInfo(new Date(), p.lat), mk = si.marks;
      const df = d => new Intl.DateTimeFormat("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit", hour12: hour12(), timeZone: zone }).format(d);
      out.push("SEASON", sub, `${si.season}, ${Math.round(si.frac * 100)}% through. ${si.eventLabel} in ${si.days} days.`,
        `This year: March equinox ${df(mk[0])} · June solstice ${df(mk[1])} · September equinox ${df(mk[2])} · December solstice ${df(mk[3])}`, ""); }
    out.push("NIGHT SKY", sub);
    const sk = skyData();
    if (!sk.dark) out.push("The sky doesn't get properly dark here tonight, so no star chart.", "");
    else {
      out.push(`${sk.isNow ? "Right now" : "Tonight around " + fmtTime(sk.when)}, the best placed constellations:`, "");
      out.push(...asciiSky(sk), "");
      sk.vis.forEach((c, i) => out.push(`${String(i + 1).padStart(2)}. ${c.name}`, `    Look ${dir16(c.azimuth)}, ${heightWord(c.altitude)} (altitude ${Math.round(c.altitude)}°, azimuth ${Math.round(c.azimuth)}°)`, `    ${c.tip}`));
      if (sk.moon.altitude > 0) out.push(` M. Moon: ${dir16(sk.moon.azimuth)}, ${heightWord(sk.moon.altitude)} (${Math.round(sk.mIll.fraction * 100)}% lit)`);
      if (campsReady() && state.camps.list.length) { out.push("", "Stargazing campsites (darkest picks nearby, from OpenStreetMap):"); state.camps.list.slice(0, 6).forEach(c => out.push(`  - ${c.name}: ${Math.round(state.units === "f" ? c.km / 1.609 : c.km)} ${state.units === "f" ? "mi" : "km"} ${dir16(c.az)}${c.bits.length ? " (" + c.bits.join(", ") + ")" : ""}`)); }
      if (sk.rising.length) { out.push("", "Rising later tonight:"); sk.rising.forEach(c => out.push(`  - ${risingLine(c)}`)); }
      out.push("");
    }

    { const a = almanacData(), df = d => new Intl.DateTimeFormat("en-US", { weekday: "short", month: "short", day: "numeric", timeZone: zone }).format(d);
      out.push("ALMANAC", sub, `Weather lore: "${a.lore}"`,
        `Next full moon: ${a.full ? (a.blue ? "Blue Moon" : a.moonName) + ", " + df(a.full) : "n/a"}`,
        `Next meteor shower: ${a.shower ? `${a.shower.name}, peak ${df(a.shower.peak)}, up to ~${a.shower.zhr}/hr, moon ${Math.round(a.shower.moon * 100)}% lit` : "none in the next two months"}`,
        `Next cross-quarter day: ${a.cq ? `${a.cq.name}, ${new Intl.DateTimeFormat("en-US", { month: "short", day: "numeric", timeZone: "UTC" }).format(a.cq.d)} (${a.cq.note})` : "n/a"}`,
        `Day ${a.doy} of ${a.len}`, ""); }
    { const ch = skyChart();
      out.push("SKY HOROSCOPE (for fun)", sub);
      ch.pos.forEach(pl => out.push(`  ${pl.label.padEnd(9)} ${SIGNS[pl.sign].padEnd(12)} ${Math.floor(pl.deg).toString().padStart(2)}°${pl.retro ? "  retrograde" : ""}`));
      if (ch.asp.length) { out.push("", "Tightest aspects:"); ch.asp.slice(0, 5).forEach(x => out.push(`  ${x.a.label} ${x.name} ${x.b.label} (orb ${x.orb.toFixed(1)}°)`)); }
      out.push("", ...horoscopeText(ch), ""); }
    { const cards = tarotDraw();
      out.push("DAILY TAROT (for fun)", sub);
      cards.forEach((c, i) => out.push(`  ${i + 1}. ${c.pos}: ${c.name}${c.reversed ? " (reversed)" : ""}`, `     ${c.reversed ? c.rev : c.up}`));
      out.push("", ...tarotReading(cards), "", MYSTIC_NOTE, ""); }
    out.push(line, "Weather and air quality: Open-Meteo.com (CC BY 4.0).", "Sun and moon: calculated in the browser; times are approximate to about a minute.", line, "");
    return out.join("\n");
  }
  // Text sky map: zenith in the centre, horizon as the ring, north up, east left (held overhead)
  function asciiSky(sk) {
    const W = 49, H = 25, cx = 24, cy = 12, rx = 22, ry = 11;   // characters are ~2x taller than wide
    const g = Array.from({ length: H }, () => Array(W).fill(" "));
    const put = (x, y, ch) => { x = Math.round(x); y = Math.round(y); if (y >= 0 && y < H && x >= 0 && x < W) g[y][x] = ch; };
    for (let a = 0; a < 360; a += 0.5) { const t = a * Math.PI / 180; put(cx + rx * Math.cos(t), cy + ry * Math.sin(t), "·"); }
    put(cx, cy, "+");
    const plot = (alt, az, ch) => { const r = (90 - alt) / 90, t = az * Math.PI / 180; put(cx - rx * r * Math.sin(t), cy - ry * r * Math.cos(t), ch); };
    if (sk.moon.altitude > 0) plot(sk.moon.altitude, sk.moon.azimuth, "M");
    sk.vis.forEach((c, i) => plot(c.altitude, c.azimuth, String(i + 1)));
    const rows = g.map(r => "      " + r.join(""));
    rows.unshift(" ".repeat(6 + cx) + "N"); rows.push(" ".repeat(6 + cx) + "S");
    const mid = cy + 1; rows[mid] = "   E  " + rows[mid].slice(6) + "  W";
    rows.push("", "      Hold overhead: N at top, E on the left. + is straight up,", "      the dotted ring is the horizon. M = Moon.");
    return rows;
  }
  function reportFileName() {
    const p = zoneParts(new Date(), tz());
    const slug = state.place.name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "location";
    // count every summary made that day, whatever city it's for
    const base = `daylight-${p.year}-${String(p.month).padStart(2, "0")}-${String(p.day).padStart(2, "0")}`;
    const n = (store.get("saves", {})[base] || 0) + 1;
    return { base, name: `${base}-${String(n).padStart(2, "0")}-${slug}.txt` };
  }
  function countSave(base) {
    const saves = store.get("saves", {});
    saves[base] = (saves[base] || 0) + 1;
    // keep only the 60 most recent day counters so storage doesn't grow forever
    const keys = Object.keys(saves).sort(); while (keys.length > 60) delete saves[keys.shift()];
    store.set("saves", saves);
  }
  let reportText = "";
  function openReport() {
    reportText = buildReport();
    $("#dlPreview").textContent = reportText;
    $("#dlName").textContent = "Saves as " + reportFileName().name;
    $("#dlCopy").textContent = "Copy text";
    open("#dlScrim");
  }
  $("#dlGo").addEventListener("click", () => {
    const url = URL.createObjectURL(new Blob([reportText], { type: "text/plain;charset=utf-8" }));
    const fn = reportFileName();
    const a = el("a", { href: url, download: fn.name });
    document.body.appendChild(a); a.click(); a.remove();
    countSave(fn.base);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    close("#dlScrim");
  });
  $("#dlCopy").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(reportText); $("#dlCopy").textContent = "Copied"; } catch (e) { $("#dlCopy").textContent = "Copy failed"; }
  });
  $("#dlCancel").addEventListener("click", () => close("#dlScrim"));

  /* =========================================================
     Web search box
     ========================================================= */
  const ENGINES = { ddg: "https://duckduckgo.com/?q=", google: "https://www.google.com/search?q=", bing: "https://www.bing.com/search?q=" };
  $("#searchForm").addEventListener("submit", e => {
    e.preventDefault();
    const q = $("#searchInput").value.trim(); if (!q) return;
    const looksLikeUrl = /^(https?:\/\/)?[\w-]+(\.[\w-]+)+(\/\S*)?$/i.test(q) && !q.includes(" ");
    location.href = looksLikeUrl ? (/^https?:\/\//i.test(q) ? q : "https://" + q) : ENGINES[state.engine] + encodeURIComponent(q);
  });
  $("#refreshBtn").addEventListener("click", () => refresh(true));

  /* =========================================================
     Boot
     ========================================================= */
  tickClock();
  renderAll();
  refresh(false);
  setInterval(tickClock, 1000);
  setInterval(() => { renderAll(); }, 60e3);           // sun/moon + "updated" stamp
  setInterval(() => refresh(true), 15 * 60e3);         // fresh weather every 15 minutes
  let lastNarrow = innerWidth < 680, rsz;
  addEventListener("resize", () => { clearTimeout(rsz); rsz = setTimeout(() => { if ((innerWidth < 680) !== lastNarrow) { lastNarrow = !lastNarrow; renderAll(); } }, 200); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - state.fetchedAt > 10 * 60e3) refresh(true); });
})();
</script>
</body>
